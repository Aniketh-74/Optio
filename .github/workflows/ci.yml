name: CI

# The quality gates from IMPLEMENTATION.md Section 17. These are the contract:
# a PR that cannot pass them does not merge, because the implementer is an AI
# agent and the reviewer is one human -- tests are the primary defense against
# confident-but-wrong code (Section 9), not an afterthought.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for every job. Without this the workflow inherits the
# repository default, which on many repos is read/write -- meaning a compromised
# dependency running inside a test could push commits or publish a release.
# Nothing in CI needs more than the ability to read the code it is testing.
#
# The actions below are pinned to commit SHAs rather than tags for the same
# reason: a tag is a mutable pointer, so `@v4` is a promise the upstream owner
# can silently rewrite. The comment after each SHA records which release it was,
# since the SHA alone is unreadable.
permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint, types, and import boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: ruff (lint)
        run: ruff check --output-format=github .
      - name: ruff (format)
        run: ruff format --check .
      - name: mypy --strict
        run: mypy
      - name: Import boundaries (Section 3.1)
        # Enforces: dependencies point inward, no lane imports another lane,
        # semconv stays a leaf. A violation here is an architecture change and
        # needs an ADR, not a lint suppression.
        run: lint-imports

  test:
    name: Tests (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Linux, plus the ends of the range on macOS
        # and Windows. A full 3x5 grid would be 15 jobs to catch bugs that are
        # almost never version-specific *and* platform-specific at once; the
        # cases that actually bite are path handling, line endings, and clock
        # resolution, and those show up at the edges.
        #
        # `requires-python = ">=3.10"` is a promise to users, so an untested
        # version in that range is an unbacked claim -- 3.11 and 3.12 are here
        # because people run them, not for symmetry.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - {os: macos-latest, python-version: "3.10"}
          - {os: macos-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.10"}
          - {os: windows-latest, python-version: "3.14"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Unit and contract tests
        run: pytest -v --cov --cov-report=term-missing --cov-report=xml

      - name: Coverage gate
        # Section 17: >= 85% core. The 100% requirement on ledger.py and
        # failopen.py is added when those modules land (M1, M2).
        run: coverage report --fail-under=85

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml

  floor:
    name: Oldest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Install the declared minimums, not the latest
        # `opentelemetry-sdk>=1.27.0` is a promise to anyone whose environment
        # already pins an older OTel -- a common situation, since agentic stacks
        # tend to hold OTel back. Every other job resolves to the newest
        # release, so without this the floor is an untested claim and would
        # break silently the first time the code used a newer API.
        run: |
          pip install "opentelemetry-api==1.27.0" "opentelemetry-sdk==1.27.0"
          pip install --no-deps -e .
          pip install pytest pytest-cov hypothesis
          python -c "import opentelemetry.sdk.version as v; print('otel', v.__version__)"

      - name: Suite passes against the floor
        run: pytest -q --no-cov tests/unit tests/integration tests/contract

  install:
    name: Installs and works from a built wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the distributions
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: The sdist ships what was chosen, not what was lying around
        # Hatchling's default sweep picks up whatever is in the working
        # directory; it was shipping `.import_linter_cache/` until the sdist
        # manifest was made explicit. A stray cache in a published artifact is
        # at best noise and at worst a leak of local paths.
        shell: bash
        run: |
          python - <<'PY'
          import glob, sys, tarfile
          names = [n.split("/", 1)[-1] for n in tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames()]
          stray = [n for n in names if "cache" in n.lower() or n.endswith(".pyc") or ".github" in n]
          if stray:
              sys.exit(f"::error::sdist contains build artefacts: {stray[:10]}")
          for required in ("src/optio/__init__.py", "tests", "LICENSE", "README.md"):
              if not any(n.startswith(required) for n in names):
                  sys.exit(f"::error::sdist is missing {required}")
          print(f"sdist clean: {len(names)} files")
          PY

      - name: A downstream packager can rebuild and verify from the sdist
        # Debian, conda-forge and internal mirrors build from the sdist, not
        # from git. If its tests cannot run, nobody downstream can vouch for
        # what they are shipping -- which is the whole reason tests are in it.
        shell: bash
        run: |
          mkdir -p /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/optio-*
          python -m venv .venv
          if [ -f .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python; fi
          "$PY" -m pip install --quiet ".[dev]"
          "$PY" -m pytest -q --no-cov -p no:cacheprovider

      - name: Install the wheel the way a user would
        # Every other job uses `pip install -e .`, which runs from the source
        # tree and can pass while the *packaged* artifact is broken -- a missing
        # py.typed, a subpackage left out of the wheel, a data file that only
        # exists in git. This installs the built artifact into a clean
        # environment, outside the repo, which is what `pip install optio`
        # actually does on a stranger's machine.
        shell: bash
        run: |
          python -m venv /tmp/fresh
          if [ -f /tmp/fresh/bin/python ]; then PY=/tmp/fresh/bin/python; else PY=/tmp/fresh/Scripts/python; fi
          "$PY" -m pip install --quiet dist/*.whl
          cd /tmp
          "$PY" -c "
          import optio
          from optio import instrument, meter, RunContext, Config
          print('version:', optio.__version__)
          print('semconv:', optio.GENAI_SEMCONV_VERSION)
          import optio.semconv as s
          assert len(s.EMITTED_SIGNALS) == 9, s.EMITTED_SIGNALS
          import importlib.resources as r
          assert (r.files('optio') / 'py.typed').is_file(), 'py.typed missing from the wheel'
          print('packaged import OK')
          "

      - name: A real run produces real signals, from the installed package
        # Proves the five-minute-first-value path (SC-1) against the artifact,
        # not the repo: instrument, run, read the signals back off the span.
        shell: bash
        run: |
          if [ -f /tmp/fresh/bin/python ]; then PY=/tmp/fresh/bin/python; else PY=/tmp/fresh/Scripts/python; fi
          cd /tmp
          "$PY" -c "
          from opentelemetry.sdk.trace import TracerProvider
          from opentelemetry.sdk.trace.export import SimpleSpanProcessor
          from opentelemetry.sdk.trace.export.in_memory_span_exporter import InMemorySpanExporter
          from optio import meter, semconv

          exporter = InMemorySpanExporter()
          provider = TracerProvider()
          provider.add_span_processor(SimpleSpanProcessor(exporter))
          tracer = provider.get_tracer('agent')

          @meter(budget='\$5.00', provider=provider)
          def agent():
              for _ in range(3):
                  with tracer.start_as_current_span('llm') as span:
                      span.set_attribute(semconv.GEN_AI_REQUEST_MODEL, 'gpt-4o')
                      span.set_attribute(semconv.GEN_AI_USAGE_INPUT_TOKENS, 1_000_000)
                      span.set_attribute(semconv.GEN_AI_USAGE_OUTPUT_TOKENS, 0)

          agent()
          run_span = next(s for s in exporter.get_finished_spans() if s.name.startswith('optio.run'))
          attrs = dict(run_span.attributes or {})
          cost = attrs.get(semconv.RUN_ACTUAL_COST)
          assert cost is not None, f'no cost signal on the run span: {attrs}'
          assert abs(cost - 7.50) < 0.01, cost
          assert attrs.get(semconv.RUN_BUDGET_REMAINING) is not None
          print(f'installed package emitted actual_cost={cost}')
          "

  contract:
    name: Signal contract (SC-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Emitted names match pinned semconv and docs/signals.md
        # Blocking on every PR. Downstream OPA/Cedar/AGT policies are written
        # against these exact strings (R-TECH-2).
        run: pytest -v -m contract

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pip-audit
        # Audits the resolved dependency set rather than the environment.
        #
        # `pip-audit --strict` on the environment fails with "Dependency not
        # found on PyPI: optio (0.1.0.dev0)" -- optio is installed
        # editable and unpublished, so it can never be audited, and --strict
        # turns that into a hard failure. `--skip-editable` does not help:
        # --strict counts the deliberate skip as a collection failure too.
        #
        # Freezing the non-editable set keeps --strict fully in force for every
        # third-party package (the actual supply-chain surface, Section 10)
        # while leaving out the one distribution that cannot be looked up.
        # Weakening --strict instead would have made the gate stop reporting
        # collection failures for real dependencies.
        run: |
          pip freeze --exclude-editable > requirements-audit.txt
          wc -l < requirements-audit.txt
          pip-audit --strict --desc -r requirements-audit.txt

  # ---------------------------------------------------------------------------
  # Gates below activate as their milestones land. They are declared now, and
  # skipped rather than omitted, so the full Section 17 checklist is visible in
  # every CI run instead of being remembered later.
  # ---------------------------------------------------------------------------

  failinject:
    name: Fail-open proof (SC-4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Agent is never broken by an internal failure
        # Blocking as of M1 (R-TECH-4). An empty suite is now itself a failure:
        # exit 5 would mean the proof silently stopped running.
        run: pytest -v -m failinject
      - name: Guard is fully covered
        # Section 17 requires 100% on failopen.py. This is the one component
        # that must be correct, so partial coverage fails the build rather than
        # relying on anyone remembering the rule.
        run: |
          pytest -q --cov=optio.runtime.failopen \
                    --cov-report=term-missing --cov-fail-under=100

  ledger:
    name: Ledger invariant (R-TECH-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Reserve/reconcile invariant holds under random interleavings
        # The property suite *is* M2-2's acceptance criterion. Both ways of
        # breaking the invariant produce a wrong number rather than an error, so
        # nothing downstream would catch a regression here.
        run: pytest -v -m property
      - name: Ledger is fully covered
        # Section 17 requires 100% on ledger.py, for the same reason as the
        # guard: silent wrongness in the cost total is the product's worst
        # possible bug.
        run: |
          pytest -q --cov=optio.lanes.cost.ledger \
                    --cov-report=term-missing --cov-fail-under=100

  frameworks:
    name: Adapter vs real ${{ matrix.framework }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per framework, isolated on purpose: these are large,
        # opinionated dependency trees that conflict with each other, and a
        # shared environment would mean a resolver failure in one framework
        # silently skipping the others. Isolation also means a framework
        # breaking upstream turns one square red instead of the whole matrix.
        include:
          - {framework: langgraph, package: "langgraph", suite: TestLangGraph, python: "3.12"}
          - {framework: openai-agents, package: "openai-agents", suite: TestOpenAIAgents, python: "3.12"}
          - {framework: claude-agent-sdk, package: "claude-agent-sdk", suite: TestClaudeAgentSDK, python: "3.12"}
          # CrewAI pulls a NumPy that has no wheel for the newest CPython and
          # fails to build from source; 3.12 is the newest it installs on
          # cleanly. Pinned rather than floated so the failure, when it comes,
          # is a version bump here and not a mystery.
          - {framework: crewai, package: "crewai", suite: TestCrewAI, python: "3.12"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Install the real ${{ matrix.framework }}
        run: pip install "${{ matrix.package }}"

      - name: Record the version under test
        # Printed so a future failure can be tied to a specific release without
        # re-running anything (R-TECH-3: adapters break on framework churn).
        run: pip show "${{ matrix.package }}" | head -2

      - name: The adapter recognises what the framework really builds
        # OPTIO_REQUIRE_FRAMEWORKS turns "not installed" from a skip into a
        # failure. Locally these skip so a contributor need not install four
        # heavy trees; here the whole point is that they ran.
        env:
          OPTIO_REQUIRE_FRAMEWORKS: "1"
        run: |
          pytest -v -m frameworks \
            "tests/frameworks/test_real_frameworks.py::${{ matrix.suite }}" \
            "tests/frameworks/test_real_frameworks.py::TestNoFrameworkClaimsAnother"

  soak:
    name: Long-run memory stability (Section 11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Memory is bounded by window size, not by run length
        # Section 11 budgets memory per run and names a soak test as its
        # verification; there was none. This is the failure no other suite can
        # see: nothing breaks, it just grows. A few hundred bytes leaked per run
        # is invisible in a unit test and fatal in a process that stays up for
        # a week.
        #
        # Slower than the other jobs (~50s) because the growth only becomes
        # measurable over tens of thousands of runs.
        run: pytest -v -s -m soak --no-cov

  behavior:
    name: Detector false-positive rate (Section 6.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Healthy runs are not flagged as pathological
        # Section 6.4 requires the FP rate to be a published metric. This job
        # produces the number quoted in docs/behavior.md and fails if it
        # regresses -- a hand-written figure would drift silently the moment a
        # threshold changed. -s so the measurement appears in the log.
        #
        # The detection rate is gated alongside it because an FP rate of zero
        # is trivially achievable by never detecting anything.
        run: pytest -v -s tests/unit/test_false_positive_rate.py tests/unit/test_detectors.py

  policy:
    name: Policy packs (SC-3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Install OPA
        # Pinned: the packs use `rego.v1`, and an engine upgrade that changed
        # Rego semantics should fail here as a visible version bump rather than
        # silently on some later unrelated PR.
        run: |
          curl -sSL -o /usr/local/bin/opa \
            https://openpolicyagent.org/downloads/v1.4.2/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version

      # Cedar needs no install step: `cedarpy` (the Python bindings) ships in
      # the dev extras, so the same engine runs here and on a contributor's
      # machine. The `cedar` CLI would need a Rust toolchain and a ~2 min build
      # for no additional coverage.

      - name: Packs evaluate correctly against sample signals
        # SC-3 requires >= 3 engines with working example rules. The env var
        # turns a missing binary from a skip into a failure: locally these
        # tests skip when opa/cedar are absent, and a gate that can pass by
        # skipping is not a gate.
        env:
          OPTIO_REQUIRE_POLICY_ENGINES: "1"
        run: pytest -v -m policy

  demo:
    name: Standalone demo (ADR-006)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Demo produces the signals it claims
        # Runs run_demo.main() in process and asserts on its output.
        run: pytest -v -m demo

      - name: One command on a fresh machine
        # The claim ADR-006 actually makes, and the only place it is tested:
        # a clone, one command, no setup. `--exit-code-from demo` propagates
        # the demo's own verification, so a demo that runs but stops
        # demonstrating anything fails the build rather than printing $0.00.
        #
        # `--exit-code-from` is deliberately not used: it implies
        # `--abort-on-container-exit`, which stops *all* containers the instant
        # the demo exits -- including the collector, potentially mid-flush and
        # before it has printed the spans it received. The next step needs
        # those lines, so the collector is started detached and left running,
        # and the demo's exit code is read from the container it ran in.
        #
        # That exit code is still the gate: it is the demo's own `_verify()`,
        # so a demo that runs but stops demonstrating anything fails the build.
        # `docker wait` blocks until the container exits and prints its status,
        # which is the one way to read it without any implied teardown.
        working-directory: examples/demo
        run: |
          docker compose up --build -d
          docker compose logs -f demo &
          status=$(docker wait optio-demo)
          wait %1 2>/dev/null || true
          echo "demo exited with status $status"
          exit "$status"

      - name: Collector received the signals
        # The compose run above proves the demo works; this proves the signals
        # travelled a real OTLP pipeline to a real collector rather than only
        # being printed by the process that computed them.
        #
        # Polls rather than reading once. The previous step returns when the
        # *demo* container exits, but the collector is a separate container
        # with a 1s batch timeout and an asynchronous debug exporter, so a
        # single immediate read races the flush and reports a false negative.
        working-directory: examples/demo
        run: |
          signals="gen_ai.run.actual_cost gen_ai.run.loop_state"
          for attempt in $(seq 1 30); do
            docker compose logs --no-color collector > collector.log 2>&1
            missing=""
            for signal in $signals; do
              grep -q "$signal" collector.log || missing="$missing $signal"
            done
            if [ -z "$missing" ]; then
              for signal in $signals; do
                echo "ok: $signal reached the collector"
              done
              exit 0
            fi
            sleep 1
          done

          echo "::error::never reached the collector:$missing"
          echo "--- collector log ---"
          cat collector.log
          exit 1

      - name: Tear down
        if: always()
        working-directory: examples/demo
        run: docker compose down -v

  benchmark:
    name: Overhead budget (SC-5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Cost + behavior lanes under 5 ms p99
        # Blocking as of M2. Section 11 calls the overhead numbers "design
        # budgets to be verified by benchmark, not measured results" -- this is
        # the verification, so an empty suite is a failure rather than a pass.
        # -s so the measured numbers appear in the log and can be published.
        run: pytest -v -s -m bench
