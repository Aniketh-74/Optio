name: CI

# The quality gates from IMPLEMENTATION.md Section 17. These are the contract:
# a PR that cannot pass them does not merge, because the implementer is an AI
# agent and the reviewer is one human -- tests are the primary defense against
# confident-but-wrong code (Section 9), not an afterthought.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint, types, and import boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: ruff (lint)
        run: ruff check --output-format=github .
      - name: ruff (format)
        run: ruff format --check .
      - name: mypy --strict
        run: mypy
      - name: Import boundaries (Section 3.1)
        # Enforces: dependencies point inward, no lane imports another lane,
        # semconv stays a leaf. A violation here is an architecture change and
        # needs an ADR, not a lint suppression.
        run: lint-imports

  test:
    name: Tests (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Floor and ceiling of the supported range, on both major platforms.
        python-version: ["3.10", "3.13"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Unit and contract tests
        run: pytest -v --cov --cov-report=term-missing --cov-report=xml

      - name: Coverage gate
        # Section 17: >= 85% core. The 100% requirement on ledger.py and
        # failopen.py is added when those modules land (M1, M2).
        run: coverage report --fail-under=85

      - name: Upload coverage
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  contract:
    name: Signal contract (SC-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Emitted names match pinned semconv and docs/signals.md
        # Blocking on every PR. Downstream OPA/Cedar/AGT policies are written
        # against these exact strings (R-TECH-2).
        run: pytest -v -m contract

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pip-audit
        # Audits the resolved dependency set rather than the environment.
        #
        # `pip-audit --strict` on the environment fails with "Dependency not
        # found on PyPI: agentmeter (0.1.0.dev0)" -- agentmeter is installed
        # editable and unpublished, so it can never be audited, and --strict
        # turns that into a hard failure. `--skip-editable` does not help:
        # --strict counts the deliberate skip as a collection failure too.
        #
        # Freezing the non-editable set keeps --strict fully in force for every
        # third-party package (the actual supply-chain surface, Section 10)
        # while leaving out the one distribution that cannot be looked up.
        # Weakening --strict instead would have made the gate stop reporting
        # collection failures for real dependencies.
        run: |
          pip freeze --exclude-editable > requirements-audit.txt
          wc -l < requirements-audit.txt
          pip-audit --strict --desc -r requirements-audit.txt

  # ---------------------------------------------------------------------------
  # Gates below activate as their milestones land. They are declared now, and
  # skipped rather than omitted, so the full Section 17 checklist is visible in
  # every CI run instead of being remembered later.
  # ---------------------------------------------------------------------------

  failinject:
    name: Fail-open proof (SC-4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Agent is never broken by an internal failure
        # Blocking as of M1 (R-TECH-4). An empty suite is now itself a failure:
        # exit 5 would mean the proof silently stopped running.
        run: pytest -v -m failinject
      - name: Guard is fully covered
        # Section 17 requires 100% on failopen.py. This is the one component
        # that must be correct, so partial coverage fails the build rather than
        # relying on anyone remembering the rule.
        run: |
          pytest -q --cov=agentmeter.runtime.failopen \
                    --cov-report=term-missing --cov-fail-under=100

  ledger:
    name: Ledger invariant (R-TECH-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Reserve/reconcile invariant holds under random interleavings
        # The property suite *is* M2-2's acceptance criterion. Both ways of
        # breaking the invariant produce a wrong number rather than an error, so
        # nothing downstream would catch a regression here.
        run: pytest -v -m property
      - name: Ledger is fully covered
        # Section 17 requires 100% on ledger.py, for the same reason as the
        # guard: silent wrongness in the cost total is the product's worst
        # possible bug.
        run: |
          pytest -q --cov=agentmeter.lanes.cost.ledger \
                    --cov-report=term-missing --cov-fail-under=100

  behavior:
    name: Detector false-positive rate (Section 6.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Healthy runs are not flagged as pathological
        # Section 6.4 requires the FP rate to be a published metric. This job
        # produces the number quoted in docs/behavior.md and fails if it
        # regresses -- a hand-written figure would drift silently the moment a
        # threshold changed. -s so the measurement appears in the log.
        #
        # The detection rate is gated alongside it because an FP rate of zero
        # is trivially achievable by never detecting anything.
        run: pytest -v -s tests/unit/test_false_positive_rate.py tests/unit/test_detectors.py

  policy:
    name: Policy packs (SC-3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Install OPA
        # Pinned: the packs use `rego.v1`, and an engine upgrade that changed
        # Rego semantics should fail here as a visible version bump rather than
        # silently on some later unrelated PR.
        run: |
          curl -sSL -o /usr/local/bin/opa \
            https://openpolicyagent.org/downloads/v1.4.2/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version

      # Cedar needs no install step: `cedarpy` (the Python bindings) ships in
      # the dev extras, so the same engine runs here and on a contributor's
      # machine. The `cedar` CLI would need a Rust toolchain and a ~2 min build
      # for no additional coverage.

      - name: Packs evaluate correctly against sample signals
        # SC-3 requires >= 3 engines with working example rules. The env var
        # turns a missing binary from a skip into a failure: locally these
        # tests skip when opa/cedar are absent, and a gate that can pass by
        # skipping is not a gate.
        env:
          AGENTMETER_REQUIRE_POLICY_ENGINES: "1"
        run: pytest -v -m policy

  demo:
    name: Standalone demo (ADR-006)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Demo produces the signals it claims
        # Runs run_demo.main() in process and asserts on its output.
        run: pytest -v -m demo

      - name: One command on a fresh machine
        # The claim ADR-006 actually makes, and the only place it is tested:
        # a clone, one command, no setup. `--exit-code-from demo` propagates
        # the demo's own verification, so a demo that runs but stops
        # demonstrating anything fails the build rather than printing $0.00.
        working-directory: examples/demo
        run: docker compose up --build --abort-on-container-exit --exit-code-from demo

      - name: Collector received the signals
        # The compose run above proves the demo works; this proves the signals
        # travelled a real OTLP pipeline to a real collector rather than only
        # being printed by the process that computed them.
        working-directory: examples/demo
        run: |
          docker compose logs collector > collector.log
          for signal in gen_ai.run.actual_cost gen_ai.run.loop_state; do
            if ! grep -q "$signal" collector.log; then
              echo "::error::$signal never reached the collector"
              cat collector.log
              exit 1
            fi
            echo "ok: $signal reached the collector"
          done

      - name: Tear down
        if: always()
        working-directory: examples/demo
        run: docker compose down -v

  benchmark:
    name: Overhead budget (SC-5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Cost + behavior lanes under 5 ms p99
        # Blocking as of M2. Section 11 calls the overhead numbers "design
        # budgets to be verified by benchmark, not measured results" -- this is
        # the verification, so an empty suite is a failure rather than a pass.
        # -s so the measured numbers appear in the log and can be published.
        run: pytest -v -s -m bench
