name: Release

# Tag -> full gate -> SBOM -> PyPI (§13).
#
# Publishing is deliberately NOT automatic on tag. The `pypi` job is gated on a
# GitHub Environment, so a tag builds and verifies everything and then waits for
# a human to approve the upload. A version number on PyPI can be yanked but
# never reused, which makes publishing the one irreversible step in this
# project -- worth a deliberate click.
#
# Trusted publishing (OIDC) is used rather than an API token: there is no
# long-lived secret in this repository to leak, and the exchange is scoped to
# this workflow in this repo. See RELEASING.md for the one-time PyPI setup.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only; skip publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gate:
    name: Full quality gate (§17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Lint, types, import boundaries
        run: |
          ruff check .
          ruff format --check .
          mypy
          lint-imports

      - name: Tests and coverage
        run: |
          pytest -q --cov --cov-report=term-missing
          coverage report --fail-under=85

      - name: The two modules that must be perfect
        run: |
          pytest -q --cov=optio.runtime.failopen --cov-fail-under=100 --cov-report=term
          pytest -q --cov=optio.lanes.cost.ledger --cov-fail-under=100 --cov-report=term

  version:
    name: Tag matches the package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: v1.2.3 must mean version = "1.2.3"
        # Cheap check, catastrophic omission: a tag that disagrees with
        # pyproject publishes a distribution whose version nobody can trace back
        # to a commit, and it cannot be corrected afterwards because the version
        # is burned.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, pathlib, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          declared = pyproject["project"]["version"]
          print(f"tag={tag!r} pyproject={declared!r}")
          if tag != declared:
              sys.exit(f"::error::tag {tag!r} does not match pyproject version {declared!r}")
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          if f"[{declared}]" not in changelog:
              sys.exit(f"::error::CHANGELOG.md has no entry for {declared}")
          print("tag, pyproject, and CHANGELOG agree")
          PY

  build:
    name: Build, SBOM, and verify the artifact
    runs-on: ubuntu-latest
    needs: [gate, version]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
          ls -l dist/

      - name: Generate SBOM (CycloneDX)
        # §13 requires an SBOM on release. Built from an environment containing
        # *only* the wheel and its runtime dependencies, so it describes what a
        # user actually installs. The generator lives in a separate venv and is
        # invoked against this one: installing cyclonedx-bom alongside optio
        # would list the tool and its ~20 dependencies as components of optio.
        run: |
          python -m venv /tmp/sbom-target
          /tmp/sbom-target/bin/pip install --quiet dist/*.whl

          python -m venv /tmp/sbom-tool
          /tmp/sbom-tool/bin/pip install --quiet cyclonedx-bom

          /tmp/sbom-tool/bin/cyclonedx-py environment /tmp/sbom-target \
            --of JSON -o "optio-${GITHUB_REF_NAME:-dev}-sbom.json"

      - name: The SBOM describes optio, not the toolchain
        run: |
          python - <<'PY'
          import glob, json, sys
          path = glob.glob("optio-*-sbom.json")[0]
          doc = json.load(open(path))
          names = sorted(c["name"] for c in doc.get("components", []))
          print(f"{path}: CycloneDX {doc['specVersion']}, {len(names)} components")
          print("  " + ", ".join(names))
          if "optio" not in names:
              sys.exit("::error::SBOM does not list optio itself")
          leaked = [n for n in names if n.startswith("cyclonedx")]
          if leaked:
              sys.exit(f"::error::SBOM lists the generator as a dependency: {leaked}")
          PY

      - name: The artifact installs and works
        # The same check the CI `install` job runs, repeated here against the
        # exact files about to be published. A wheel that passes CI but is
        # rebuilt broken at release time is the failure this catches.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/verify/bin/python -c "
          import optio, importlib.resources as r
          from optio import instrument, meter, RunContext, Config
          import optio.semconv as s
          assert (r.files('optio') / 'py.typed').is_file()
          assert len(s.EMITTED_SIGNALS) == 9
          print('verified', optio.__version__, 'semconv', s.GENAI_SEMCONV_VERSION)
          "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            dist/*
            optio-*-sbom.json

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    # Only on a real tag, and never on a dry run.
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    environment:
      name: pypi
      url: https://pypi.org/p/optio
    permissions:
      # Mints the short-lived OIDC token trusted publishing exchanges for an
      # upload credential. No API token is stored in this repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist-all

      - name: Keep only the distributions
        # The SBOM was uploaded alongside the artifacts; PyPI must receive the
        # wheel and sdist and nothing else.
        run: |
          mkdir -p dist
          mv dist-all/dist/* dist/
          ls -l dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true
