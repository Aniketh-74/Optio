[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optio"
version = "0.3.0"
description = "Economic cost and outcome quality signals for agent runs, in OpenTelemetry GenAI vocabulary."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "optio contributors" }]
keywords = ["opentelemetry", "genai", "agents", "observability", "governance", "cost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

# Core deps stay minimal (§10 supply chain, §4.4). Framework deps live in extras
# and are NEVER imported at core import time.
dependencies = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
]

[project.optional-dependencies]
# The optimization package (ADR-013). Opt-in on purpose: it sits in the request
# path and reads prompt content, which the signals core never does. Installing
# `optio` alone must never put a request rewriter in your process.
optimize = ["tiktoken>=0.7.0"]
langgraph = ["langgraph>=0.2.0", "langchain-core>=0.3.0"]
openai = ["openai-agents>=0.0.1"]
crewai = ["crewai>=0.60.0"]
claude = ["claude-agent-sdk>=0.1.0"]
# Returned with the backend it advertises (ADR-050). It was removed in 0.1.0
# because an extra that installs a driver for an unreachable backend promises a
# feature that does not exist; `store_backend='redis'` now works, so it does.
redis = ["redis>=5.0"]
all = [
    "optio[langgraph]",
    "optio[openai]",
    "optio[crewai]",
    "optio[claude]",
]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "typing-extensions>=4.12.0",  # Self on the 3.10 floor; type-checking only
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    # Bounds the concurrency stress tests. A deadlock there would otherwise
    # hang CI rather than fail it, and "the suite stopped" is a far harder
    # signal to act on than "this test failed".
    "pytest-timeout>=2.3.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.100.0",
    "import-linter>=2.0.0",
    "pip-audit>=2.7.0",
    # Cedar engine for the policy-pack gate (SC-3). The bindings rather than
    # the `cedar` CLI, which needs a Rust toolchain -- this way the pack is
    # verified locally too, not only in CI. Test-only; never a runtime import.
    "cedarpy>=4.8.0",
    # optio_optimize's live-provider adapters (bench/providers.py). Needed to
    # exercise real SDK request/response shapes with a mocked HTTP transport
    # (no network, no key) -- without the package installed, those tests
    # import-skip, which is exactly how a prior gap here went unnoticed: the
    # `[openai]` extra above pulls in openai transitively via openai-agents,
    # but `[dev]` alone never did, so every mocked-SDK provider test silently
    # skipped in CI's main test job.
    "openai>=1.0.0",
    "anthropic>=0.34.0",
]

[project.urls]
Homepage = "https://github.com/Aniketh-74/Optio"
Documentation = "https://github.com/Aniketh-74/Optio/blob/main/docs/signals.md"
Source = "https://github.com/Aniketh-74/Optio"
Issues = "https://github.com/Aniketh-74/Optio/issues"
Changelog = "https://github.com/Aniketh-74/Optio/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/optio", "src/optio_optimize"]

# The sdist ships tests, docs, policy packs and the demo. That is deliberate:
# a downstream packager (Debian, conda-forge, an internal mirror) rebuilds from
# the sdist and needs to be able to run the suite to verify what they are
# shipping. A source distribution that cannot be tested is one nobody can
# vouch for.
#
# Listed explicitly rather than relying on the default sweep, which picks up
# whatever happens to be in the working directory -- it was shipping
# `.import_linter_cache/` until this was added. An sdist should contain what
# the maintainer chose, not what their last command left behind.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/scripts",
    "/docs",
    "/policies",
    "/examples",
    "/pyproject.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/RELEASING.md",
    "/IMPLEMENTATION.md",
    "/LICENSE",
    "/.gitattributes",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/.pytest_cache",
]

# ---------------------------------------------------------------------------
# Lint / format (§4.1)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # comprehensions
    "SIM",  # simplify
    "TID",  # tidy imports
    "RUF",  # ruff-specific
    "BLE",  # blind except — only failopen.py may catch broadly (ADR-004)
    "D",    # pydocstyle (Google convention, §4.1)
]
ignore = [
    "D100",  # module docstring not required on every internal module (§4.1)
    "D104",  # package docstring not required
    "D107",  # __init__ docstring folded into class docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]          # tests document themselves via names
"examples/**" = ["D"]

# ---------------------------------------------------------------------------
# Typing (§4.1) — strict, no silent Any
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_any_unimported = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# The real-framework matrix (tests/frameworks/) imports the actual packages.
# They are optional extras and none of them ship type stubs, so type-checking
# cannot resolve them in an environment that has not installed all four -- and
# no single environment does: CI runs one framework per isolated job precisely
# because their dependency trees conflict.
#
# Scoped to these four module names rather than silencing import errors
# globally: a typo in an `optio` import must still fail, and it would be easy
# to lose that by reaching for `ignore_missing_imports` at the top level.
[[tool.mypy.overrides]]
module = ["langgraph.*", "agents.*", "claude_agent_sdk.*", "crewai.*"]
ignore_missing_imports = true

# tiktoken is an optional accuracy upgrade for optio_optimize's token counting
# (ADR-013). It is a large wheel with a Rust extension, so it is not a hard
# dependency, and the code falls back to a heuristic counter when it is absent.
# Named explicitly for the same reason as the block above.
[[tool.mypy.overrides]]
module = ["tiktoken.*"]
ignore_missing_imports = true

# Provider SDKs used only by the live benchmark (optio_optimize.bench). Never
# imported unless someone passes --live, and installing all of them to type-check
# a benchmark would contradict the minimal-core rule they exist to demonstrate.
[[tool.mypy.overrides]]
module = ["openai.*", "anthropic.*"]
ignore_missing_imports = true

# `scripts/real_agent_run.py` drives a real agent through the OpenAI Agents SDK,
# whose `@function_tool` decorator is applied to five tool functions. That SDK
# lives in the `[openai]` extra, not `[dev]`, because the four framework trees
# conflict with each other -- so in any environment without it, `agents.*` above
# resolves to `Any`, and `disallow_any_unimported` then reports the decorator and
# the tool list as untyped. Five errors about a package that is deliberately
# absent.
#
# Found by CI, and it is the reason CI exists: `mypy` was clean on the machine
# this was written on, which had `openai-agents` installed from an earlier live
# run. A local environment that has drifted a package ahead of `[dev]` cannot
# see this class of failure at all.
#
# Scoped to this one module, and both name forms because `scripts/` has no
# `__init__.py` -- mypy names the module `real_agent_run` when invoked on the
# directory and `scripts.real_agent_run` when the path is given explicitly, and
# only one of those matches on any given invocation.
[[tool.mypy.overrides]]
module = ["real_agent_run", "scripts.real_agent_run"]
disallow_untyped_decorators = false
disallow_any_unimported = false

# ---------------------------------------------------------------------------
# Test (§9)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "property: hypothesis property tests (ledger/window invariants)",
    "failinject: fault-injection proving fail-open (SC-4)",
    "contract: semconv conformance (SC-2)",
    "integration: real span flow per adapter",
    "bench: overhead benchmarks (SC-5)",
    "policy: policy packs evaluate correctly against sample signals (SC-3)",
    "demo: the standalone demo produces the signals it claims (ADR-006)",
    "frameworks: adapters against the real frameworks they claim (R-TECH-3)",
    "soak: long-run memory stability (§11)",
    "optimize: the optio_optimize package (ADR-013)",
    "redis: needs a real Redis server; the gate runs one as a service container",
]

[tool.coverage.run]
source = ["src/optio", "src/optio_optimize"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# ---------------------------------------------------------------------------
# Import boundaries (§3.1, rule 11)
# ---------------------------------------------------------------------------
[tool.importlinter]
# Both packages, so the contract forbidding core -> optimizer imports can see
# them. A contract naming a module outside the analysed graph passes vacuously,
# which would make the ADR-013 boundary look enforced while checking nothing.
root_packages = ["optio", "optio_optimize"]

[[tool.importlinter.contracts]]
name = "Layered architecture (dependencies point inward)"
type = "layers"
layers = [
    "optio.adapters",
    "optio.api",
    "optio.runtime",
    "optio.lanes",
    "optio.store",
    "optio.semconv",
]

[[tool.importlinter.contracts]]
name = "Lanes are mutually independent"
type = "independence"
modules = [
    "optio.lanes.cost",
    "optio.lanes.behavior",
    "optio.lanes.quality",
]

[[tool.importlinter.contracts]]
name = "optio never imports the optimizer (ADR-013)"
# The whole point of the split is that installing the signals library does not
# put a request rewriter in your process. One import from core to optimizer
# would silently undo that, and it is exactly the kind of edit that looks
# harmless in review.
type = "forbidden"
source_modules = ["optio"]
forbidden_modules = ["optio_optimize"]

[[tool.importlinter.contracts]]
name = "semconv is a leaf (stdlib only)"
type = "forbidden"
source_modules = ["optio.semconv"]
forbidden_modules = [
    "optio.api",
    "optio.runtime",
    "optio.lanes",
    "optio.store",
    "optio.adapters",
    "optio.config",
]
