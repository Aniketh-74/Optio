# optio signals -> Microsoft Agent Governance Toolkit policy (M4-4, SC-3)
#
# AGT's primitive is `govern(x, policy=...)`: it decides whether an agent action
# is allowed. It has no view of money or outcome quality -- that gap is the
# reason optio exists (ADR-000). This file wires our signals into rules AGT
# can evaluate.
#
# Signal names are the exact strings from docs/signals.md. They are the
# integration contract; do not paraphrase them.
#
# ABSENCE HANDLING: `on_missing` is set explicitly on every rule and is the most
# important field in this file. optio omits a signal it cannot compute
# (unknown model price, lane disabled, lane failed and the fail-open guard
# caught it) rather than emitting a wrong number. A rule that treated missing as
# zero would read a broken cost lane as a free run and let through exactly what
# it was installed to catch. `skip` means "this rule has no opinion", which is
# the honest answer for an unknown value.

apiVersion: agentgovernance.microsoft.com/v1alpha1
kind: PolicyPack
metadata:
  name: optio-economic-and-behavioral
  description: >-
    Gate agent runs on cost and behavioral health using optio signals.
    Requires optio >= 0.1 emitting OTel GenAI span attributes.
  annotations:
    optio.io/signal-contract: docs/signals.md
    optio.io/semconv-version: "1.37.0"

spec:
  # Where the signals come from. optio writes them as span attributes on
  # the run span (ADR-009); AGT reads them from the trace context.
  source:
    type: otel_span_attributes
    namespace: gen_ai.run

  rules:
    # --- cost ----------------------------------------------------------------

    - name: projected-cost-ceiling
      description: >-
        Deny before the tokens burn. projected_cost is emitted ahead of the
        step, which is what makes this a pre-spend gate rather than an
        after-the-fact report.
      signal: gen_ai.run.projected_cost
      condition: greater_than
      threshold: 0.50
      on_missing: skip
      effect: deny
      message: "Projected run cost exceeds $0.50."

    - name: budget-headroom-floor
      description: >-
        Absent whenever no budget policy was supplied, which is most runs.
      signal: gen_ai.run.budget_remaining
      condition: less_than
      threshold: 0.05
      on_missing: skip
      effect: deny
      message: "Budget headroom below $0.05."

    - name: actual-spend-alert
      description: >-
        Visibility, not a gate. Fires on spend that is high but not yet over a
        hard limit.
      signal: gen_ai.run.actual_cost
      condition: greater_than
      threshold: 0.25
      on_missing: skip
      effect: warn
      message: "Run has spent over $0.25."

    # --- behavior -------------------------------------------------------------

    - name: stuck-agent
      description: >-
        `looping` and `retry_storm` only. `repeating` is excluded deliberately:
        healthy agents repeat calls (polling, paging, bounded retries), so
        gating on it produces false positives. Measured FP rate for the states
        below is published in docs/behavior.md.
      signal: gen_ai.run.loop_state
      condition: in
      values: ["looping", "retry_storm"]
      on_missing: skip
      effect: deny
      message: "Agent is not making progress; stopping to avoid burn."

    - name: repetition-notice
      signal: gen_ai.run.loop_state
      condition: equals
      value: repeating
      on_missing: skip
      effect: warn
      message: "Agent is repeating calls. Normal in small doses; watch the trend."

    # --- quality (opt-in; off by default per ADR-003) --------------------------

    - name: groundedness-floor
      description: >-
        Inert unless the user enabled the quality lane AND the run was sampled.
      signal: gen_ai.run.quality.groundedness
      condition: less_than
      threshold: 0.7
      on_missing: skip
      effect: deny
      message: "Response groundedness below 0.7."

    - name: unit-economics-alert
      description: >-
        Cost per successful task -- the number that says whether the agent is
        worth running at all. Needs a success signal, so it is absent until the
        quality lane lands (M5).
      signal: gen_ai.run.cost_per_successful_task
      condition: greater_than
      threshold: 1.00
      on_missing: skip
      effect: warn
      message: "Cost per successful task exceeds $1.00."

  # Fail-open is a property of optio (ADR-004): a lane that breaks emits
  # nothing rather than a wrong value. Mirror that here so a signal outage does
  # not become an agent outage. Setting this to `deny` inverts the guarantee and
  # makes our internal bug into your production incident.
  onSignalUnavailable: allow
